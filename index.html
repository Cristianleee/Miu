<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валентинка</title>
    <style>
        body {
            background-color: #ffe6f2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
            position: relative;
        }

        h2 {
            color: #ff1493;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
            background-color: rgba(255, 230, 242, 0.7);
            padding: 10px;
            border-radius: 15px;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s;
            font-family: 'Comic Sans MS', cursive;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background-color: #4CAF50;
        }

        .no-btn {
            background-color: #ff4444;
            position: relative;
        }

        .message {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            text-align: center;
            max-width: 400px;
            margin-top: 20px;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        .message h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ff1493;
        }

        .message p {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .signature {
            font-style: italic;
            text-align: right;
            color: #ff1493;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            display: inline-block;
            opacity: 0.8;
            animation: floatHeart linear infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            border-radius: 50% 50% 0 0;
        }

        .heart::before {
            left: 50%;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h2>Хочешь узнать, насколько сильно я тебя люблю?</h2>
    
    <div class="buttons-container">
        <button class="button yes-btn" onclick="showMessage()">Да</button>
        <button class="button no-btn" onmouseover="moveButton(this)">Нет</button>
    </div>

    <div class="message" id="loveMessage">
        <h1>Моему любимкинсу ❤</h1>
        <p>Милашка мой,</p>
        <p>Я благодарю судьбу за то, что она подарила мне встречу с тобой. Ты наполняешь мою жизнь светом и радостью, делаешь каждое мгновение особенным.</p>
        <p>Я люблю тебя всем сердцем и хочу быть с тобой всегда.</p>
        <div class="signature">С любовью, ❤</div>
    </div>

    <script>
        function moveButton(button) {
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            button.style.position = 'fixed';
            button.style.left = newX + 'px';
            button.style.top = newY + 'px';
        }

        function showMessage() {
            const message = document.getElementById('loveMessage');
            message.style.display = 'block';
            document.querySelector('.buttons-container').style.display = 'none';
        }

        const colors = [
            '#ff0000', '#ff69b4', '#ff1493', 
            '#ff6b6b', '#ff4d4d', '#ff3333',
            '#ff91a4', '#ff7b93', '#ff6b88'
        ];

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            
            const size = Math.random() * 20 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            heart.style.left = Math.random() * 100 + 'vw';
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            const uniqueClass = 'heart-' + Date.now();
            heart.classList.add(uniqueClass);
            
            const style = document.createElement('style');
            style.textContent = `.${uniqueClass}::before, .${uniqueClass}::after { background-color: ${color}; }`;
            document.head.appendChild(style);
            
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
                style.remove();
            }, 8000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
